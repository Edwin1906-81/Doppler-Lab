<style>
/* Layout: scanner console. Live echo is the hero; probe + 3D heart and controls sit beside it (stacked on phones). */
:root {
  --bg: #0b0e10;          /* console body */
  --panel: #12171a;       /* control deck */
  --line: #222b30;        /* hairlines */
  --fg: #dfe6e8;          /* primary text */
  --muted: #8a989d;       /* secondary text */
  --accent: #57c7d4;      /* scanner cyan: active controls, sector outline */
  --marker: #f0b43c;      /* index marker amber */
  --ecg: #4fdc7a;         /* ECG trace */
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 1400px; margin: 0 auto 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
.brand .sub { color: var(--muted); font-size: 0.82rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 7px 16px; font-family: var(--font-display); font-weight: 600; letter-spacing: 0.08em; font-size: 0.9rem; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #062026; }

.stage { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; max-width: 1400px; margin: 0 auto; }
@media (max-width: 860px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .col { display: contents; }
  .scope { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; order: 1; }
  .transport { order: 2; } #viewsDeck { order: 3; } #v3 { order: 4; } #probeDeck { order: 5; } .note { order: 6; }
}
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.scope { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; border: 1px solid var(--line); }
.scope canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.view3d { position: relative; background: #0a0d0f; border-radius: 10px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; border: 1px solid var(--line); touch-action: none; cursor: grab; }
.view3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.view3d .hint { position: absolute; left: 10px; bottom: 8px; font-size: 0.72rem; color: var(--muted); pointer-events: none; }
.view3d .tools { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; }

.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; color: var(--fg); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: #0f2328; }
.chip.small { padding: 4px 10px; font-size: 0.74rem; background: rgba(18,23,26,0.85); }

.deck { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.deck h2 { font-family: var(--font-display); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.views { display: flex; flex-wrap: wrap; gap: 6px; }
.status { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.status .near { font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); }
.status .near.off { color: var(--muted); }

.sliders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
@media (max-width: 520px) { .sliders { grid-template-columns: minmax(0, 1fr); } }
.sl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sl .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; }
.sl .lab span:last-child { font-family: var(--font-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.sl .ends { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--muted); }
.sl .row { display: flex; align-items: center; gap: 6px; }
.sl .row input { flex: 1; min-width: 0; }
.nudge { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; width: 30px; height: 28px; cursor: pointer; font-family: var(--font-mono); }
input[type=range] { -webkit-appearance: none; appearance: none; height: 28px; background: transparent; width: 100%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--line); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 4px; background: var(--line); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); margin-top: -7px; border: 2px solid #062026; }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid #062026; }

.transport { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.transport .grow { flex: 1 1 140px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 0.82rem; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.note { color: var(--muted); font-size: 0.74rem; line-height: 1.45; max-width: 70ch; }
.err { padding: 24px; color: var(--fg); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

<div class="top">
  <div class="brand"><h1>TTE &amp; TEE Simulator</h1><span class="sub">Pulmonary POCUS</span></div>
  <div class="seg" role="group" aria-label="Modality">
    <button id="mTTE" aria-pressed="true">TTE</button><button id="mTEE" aria-pressed="false">TEE</button>
  </div>
</div>

<div class="stage">
  <div class="col">
    <div class="scope" id="scope"><canvas id="echo"></canvas><canvas id="ov"></canvas></div>
    <div class="transport">
      <button class="btn" id="play" aria-pressed="true">Pause</button>
      <div class="sl grow"><div class="lab"><span>Heart rate</span><span id="hrV">72 bpm</span></div><input type="range" id="hr" min="40" max="140" value="72"></div>
      <div class="sl grow"><div class="lab"><span>Gain</span><span id="gainV">50</span></div><input type="range" id="gain" min="0" max="100" value="50"></div>
      <button class="btn" id="labels" aria-pressed="true">Labels</button>
    </div>
  </div>
  <div class="col">
    <div class="deck" id="viewsDeck">
      <div class="status"><h2 id="viewsTitle">Standard views</h2><span class="near" id="near"></span></div>
      <div class="views" id="views"></div>
    </div>
    <div class="deck" id="probeDeck">
      <h2>Probe</h2>
      <div class="sliders" id="sliders"></div>
    </div>
    <div class="view3d" id="v3"><canvas id="c3"></canvas>
      <div class="tools"><button class="chip small" id="cut" aria-pressed="false">Cut heart</button><button class="chip small" id="skin" aria-pressed="true">Chest wall</button><button class="chip small" id="reset3">Reset view</button></div>
      <span class="hint">Drag to rotate · scroll or pinch to zoom</span>
    </div>
    <p class="note">Simulated images from an original 3D heart model, for teaching probe manipulation and view recognition. Not for clinical measurement.</p>
  </div>
</div>

<script>
// ===== Anatomy: original heart model (all coordinates in cm) =====
// Body frame labels: X = patient left, Y = anterior, Z = cranial. Origin = LV base center.
// Heart frame: Z_h = base direction (apex -> base), Y_h = anterior, X_h = Y_h x Z_h.
const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  // rotate v about unit axis k by angle th (Rodrigues)
  rot: (v, k, th) => {
    const c = Math.cos(th), s = Math.sin(th), kv = V3.cross(k, v), kd = V3.dot(k, v);
    return [v[0] * c + kv[0] * s + k[0] * kd * (1 - c), v[1] * c + kv[1] * s + k[1] * kd * (1 - c), v[2] * c + kv[2] * s + k[2] * kd * (1 - c)];
  },
};

const APEX_DIR = V3.norm([0.68, 0.42, -0.58]);
const ZH = V3.mul(APEX_DIR, -1);
const YH = V3.norm(V3.sub([0, 1, 0], V3.mul(ZH, V3.dot([0, 1, 0], ZH))));
const XH = V3.cross(YH, ZH);
const toH = (b) => [V3.dot(b, XH), V3.dot(b, YH), V3.dot(b, ZH)];
const toB = (h) => V3.add(V3.add(V3.mul(XH, h[0]), V3.mul(YH, h[1])), V3.mul(ZH, h[2]));

// ---- landmarks in body coordinates ----
const AN = {};
AN.Mb = [0.5, -0.5, 0.0];                       // mitral annulus center
AN.Ab = [-1.3, 0.7, 0.8];                       // aortic valve center
AN.aoDir = V3.norm([-0.3, 0.35, 0.9]);          // aortic root axis
AN.LAc = [-0.5, -2.6, 1.8];
AN.RAc = [-4.1, -0.9, 0.5];
AN.PVb = [0.6, 2.9, 2.5];                       // pulmonic valve center
AN.apexH = [0, 0, -8.1];                        // LV endocardial apex (heart frame)
AN.apex = toB(AN.apexH);
AN.RVcH = [-2.9, 1.9, -2.3];                    // RV cavity center (heart frame)
AN.RVc = toB(AN.RVcH);
AN.Tb = [-2.9, 0.8, -1.1];                      // tricuspid annulus center
AN.tvDir = V3.norm(V3.sub(AN.RVc, AN.RAc));     // into RV
AN.LVmidH = [0, 0, -4.0];
AN.LVmid = toB(AN.LVmidH);

// aortic chain: [point, radius]
const aoP = (t) => V3.add(AN.Ab, V3.mul(AN.aoDir, t));
AN.aorta = [
  [AN.Ab, 1.12], [aoP(1.0), 1.55], [aoP(2.3), 1.3], [aoP(5.4), 1.45],
  [[-1.0, -0.6, 8.7], 1.35], [[1.4, -4.4, 7.4], 1.25], [[1.6, -6.0, 3.0], 1.2], [[1.6, -6.0, -17], 1.1],
];
AN.pa = [[AN.PVb, 1.15], [[1.0, 0.3, 5.0], 1.2]];
AN.rpa = [[[1.0, 0.3, 5.0], 1.0], [[-4.6, -2.4, 4.6], 0.85]];
AN.lpa = [[[1.0, 0.3, 5.0], 1.0], [[4.4, -1.2, 5.4], 0.85]];
AN.rvot = [[toB([-2.3, 3.4, -0.8]), 1.4], [AN.PVb, 1.15]];
AN.lvot = [[toB([-0.5, 0.8, -1.4]), 0.95], [AN.Ab, 1.12]];
AN.laa = [[[0.9, -1.4, 2.6], 0.7], [[2.7, -0.1, 2.7], 0.42]];
AN.svc = [[[-4.0, -0.5, 2.4], 1.0], [[-3.7, -0.1, 11], 1.0]];
AN.ivc = [[[-4.0, -1.0, -1.4], 1.1], [[-3.5, -1.8, -8], 1.15], [[-2.6, -3.0, -19], 1.1]];
AN.pveins = [
  [[-2.0, -3.1, 2.5], [-5.2, -3.4, 3.4]], [[-2.0, -3.5, 1.0], [-5.2, -3.9, 0.3]],
  [[0.9, -3.1, 2.6], [4.4, -3.5, 3.5]], [[1.0, -3.5, 1.1], [4.4, -4.1, 0.4]],
];
AN.hv = [[[-3.5, -1.7, -7.2], [-10.5, -1.0, -11.5]], [[-3.5, -1.7, -7.2], [-4.0, 4.5, -11.5]], [[-3.4, -1.8, -7.4], [1.5, 2.6, -10.5]]];
AN.esoX = -0.4; AN.esoY = -5.1;
AN.descAo = [1.6, -6.0];

// TEE esophagus / stomach path [point], depth from incisors at first point
AN.esoPath = [[-0.6, -5.9, 17], [-0.5, -5.2, 6], [-0.4, -5.1, 0], [0.0, -4.7, -4.6], [1.6, -3.9, -7.4], [3.6, -2.7, -9.0], [5.8, -1.3, -9.9]];
AN.esoDepth0 = 16;

// ---- torso ----
const TORSO = { cx: -1, cy: -1, a: 16, b: 8.6 };
function skinPoint(X, Z) {
  const u = (X - TORSO.cx) / TORSO.a;
  const Y = TORSO.cy + TORSO.b * Math.sqrt(Math.max(0, 1 - u * u));
  const N = V3.norm([(X - TORSO.cx) / (TORSO.a * TORSO.a), (Y - TORSO.cy) / (TORSO.b * TORSO.b), 0]);
  return { S: [X, Y, Z], N };
}
function torsoHit(P, D) { // first exit of ray from inside torso
  let t = 0;
  for (let i = 0; i < 400; i++) {
    const q = V3.add(P, V3.mul(D, t));
    const e = ((q[0] - TORSO.cx) / TORSO.a) ** 2 + ((q[1] - TORSO.cy) / TORSO.b) ** 2;
    if (e >= 1) return q;
    t += 0.05;
  }
  return V3.add(P, V3.mul(D, t));
}

// ---- esophagus path ----
function esoAt(depth) {
  let s = depth - AN.esoDepth0, P = AN.esoPath;
  for (let i = 0; i < P.length - 1; i++) {
    const seg = V3.sub(P[i + 1], P[i]), L = V3.len(seg);
    if (s <= L || i === P.length - 2) {
      const t = Math.max(0, Math.min(s / L, 1.6));
      return { p: V3.add(P[i], V3.mul(seg, t)), T: V3.norm(seg) };
    }
    s -= L;
  }
}

// ---- probe poses ----
// TEE: depth (cm), turn (deg, + = right), flex (deg, + = ante), omni (deg)
function teePose(st) {
  const e = esoAt(st.depth), T = e.T, up = V3.mul(T, -1);
  let b = V3.norm(V3.sub([0, 1, 0], V3.mul(up, V3.dot([0, 1, 0], up))));
  b = V3.rot(b, up, st.turn * Math.PI / 180);
  const e1 = V3.norm(V3.cross(b, up));
  const f = st.flex * Math.PI / 180;
  const b2 = V3.rot(b, e1, f), up2 = V3.rot(up, e1, f);
  const w = st.omni * Math.PI / 180;
  const L = V3.norm(V3.add(V3.mul(e1, Math.cos(w)), V3.mul(up2, Math.sin(w))));
  // flexed tip: joint 2.5 cm above transducer
  const joint = V3.add(e.p, V3.mul(up, 2.2));
  const tipDir = V3.rot(T, e1, f);
  const tip = V3.add(joint, V3.mul(tipDir, 2.2));
  const O = V3.add(tip, V3.mul(b2, 0.55));
  return { O, B: b2, L, joint, tip, tipDir, e1, up: up2 };
}

// bone model mirror of the shader (for choosing windows)
const RIB0 = 6.0, RIBS = 0.42;
function skinDepthJS(p) {
  const gx = 2 * (p[0] - TORSO.cx) / (TORSO.a * TORSO.a), gy = 2 * (p[1] - TORSO.cy) / (TORSO.b * TORSO.b);
  const f = ((p[0] - TORSO.cx) / TORSO.a) ** 2 + ((p[1] - TORSO.cy) / TORSO.b) ** 2 - 1;
  return -f / Math.hypot(gx, gy);
}
function boneJS(p) {
  const sd = skinDepthJS(p);
  if (p[1] < -1) return Math.hypot(p[0] + 1, p[1] + 10.2) < 2.1;
  if (sd > 0.9 && sd < 2.2 && Math.abs(p[0] + 1.2) < 1.2 && p[2] > -8.6 && p[2] < 9) return true;
  if (sd > 1.55 && sd < 2.4 && p[2] > -9.6) {
    const X = p[0] + 1;
    if (Math.abs(X) > 1) for (let k = 0; k < 7; k++) { const zk = RIB0 - 3.3 * k - RIBS * Math.abs(X); if (Math.abs(p[2] - zk) < 0.58) return true; }
  }
  return false;
}
// fraction of the sector's scan lines blocked by bone within the first 4 cm
function blockedFrac(pose) {
  let n = 0, b = 0;
  for (let a = -0.75; a <= 0.75; a += 0.05) {
    n++;
    const d = V3.add(V3.mul(pose.B, Math.cos(a)), V3.mul(pose.L, Math.sin(a)));
    for (let r = 0.1; r < 4; r += 0.08) if (boneJS(V3.add(pose.O, V3.mul(d, r)))) { b += Math.abs(a) < 0.35 ? 3 : 1; break; }
  }
  return b / n;
}
// best plane through S: fit weighted points, keep 'avoid' points out by a margin
function fitPlane(S, pts, avoid = [], stepDeg = 3) {
  let best = null;
  for (let th = 0; th < 180; th += stepDeg) for (let ph = 0; ph < 180; ph += stepDeg) {
    const t = th * Math.PI / 180, p = ph * Math.PI / 180;
    const n = [Math.sin(t) * Math.cos(p), Math.sin(t) * Math.sin(p), Math.cos(t)];
    let sc = 0;
    for (const [X, w] of pts) { const d = V3.dot(V3.sub(X, S), n); sc += w * d * d; }
    for (const [X, k, w] of avoid) { const d = Math.abs(V3.dot(V3.sub(X, S), n)); if (d < k) sc += w * (k - d) ** 2; }
    if (!best || sc < best.sc) best = { sc, n };
  }
  return best;
}
// TTE presets built from anatomy
function planeFrom(S, target, n, sideVec) {
  // beam from S toward target, constrained to plane with normal n
  let B = V3.norm(V3.sub(target, S));
  B = V3.norm(V3.sub(B, V3.mul(n, V3.dot(B, n))));
  let L = V3.norm(V3.cross(n, B));
  if (V3.dot(L, sideVec) < 0) L = V3.mul(L, -1);
  return { O: S, B, L };
}
function apicalSkin() { // skin point nearest the apex, nudged inferolaterally
  let best = null;
  for (let X = 2; X <= 12; X += 0.1) for (let Z = -10; Z <= -2; Z += 0.1) {
    const S = skinPoint(X, Z).S; const d = V3.len(V3.sub(S, V3.add(AN.apex, V3.mul(APEX_DIR, 0.0))));
    if (!best || d < best.d) best = { d, S };
  }
  return V3.add(best.S, [0.6, 0, -0.6]);
}
function bestWindow(X0, Z0, build, rad = 1.6) {
  let best = null;
  for (let dx = -rad; dx <= rad; dx += 0.2) for (let dz = -rad; dz <= rad; dz += 0.2) {
    const S = skinPoint(X0 + dx, Z0 + dz).S;
    const pose = build(S);
    const sc = blockedFrac(pose) + 0.02 * (dx * dx + dz * dz);
    if (!best || sc < best.sc) best = { sc, S };
  }
  return best.S;
}
function buildTTEPresets() {
  const plaxB = (S) => { const n = V3.norm(V3.cross(APEX_DIR, V3.sub(AN.Mb, S))); return planeFrom(S, AN.Mb, n, ZH); };
  const para = bestWindow(1.3, 2.4, plaxB);
  const apical0 = apicalSkin();
  const a4B = (S) => { const n = V3.norm(V3.cross(V3.sub(AN.Mb, S), V3.sub(AN.Tb, S))); return planeFrom(S, V3.lerp(AN.Mb, AN.Tb, 0.5), n, V3.sub(AN.Mb, AN.Tb)); };
  const apical = bestWindow(apical0[0], apical0[2], a4B, 1.2);
  const sub = [-0.8, skinPoint(-0.8, 0).S[1] - 0.3, -12.5];
  const P = {};
  const nPL = V3.norm(V3.cross(APEX_DIR, V3.sub(AN.Mb, para)));
  P.PLAX = { ...planeFrom(para, AN.Mb, nPL, ZH), depth: 16, win: 'para' };
  // RV inflow: plane holds the RA, the tricuspid valve and the RV long axis, from a lower, more medial window
  const rvApex = toB([-3.4, 2.2, -5.6]);
  const rviB = (S) => { const n = V3.norm(V3.cross(V3.sub(AN.Tb, S), V3.sub(rvApex, AN.RAc))); return planeFrom(S, V3.lerp(AN.Tb, AN.RVc, 0.35), n, ZH); };
  const paraLow = bestWindow(1.2, -0.4, rviB, 2.0);
  {
    // rotate about the beam toward the TV until the plane clears the LVOT and aortic root but keeps the RV body and RA
    const base = rviB(paraLow), u = base.B, lvotPt = V3.lerp(AN.lvot[0][0], AN.Ab, 0.4);
    let best = null;

const vec3 AV_C = ${H(AN.Ab)}; const vec3 AV_U = ${v3(avU)}; const vec3 AV_V = ${v3(avV)}; const vec3 AV_N = ${v3(avN)};
const vec3 PV_C = ${H(AN.PVb)}; const vec3 PV_U = ${v3(pvU)}; const vec3 PV_V = ${v3(pvV)}; const vec3 PV_N = ${v3(pvN)};
const vec3 LA_C = ${H(AN.LAc)}; const vec3 RA_C = ${H(AN.RAc)};
const vec3 SEP_P = ${H(sepMid)}; const vec3 SEP_N = ${v3(toH(sepN))};
const vec3 RVOT0 = ${H(AN.rvot[0][0])};
const vec3 RV_C = vec3(${AN.RVcH.map(f).join(',')});
const vec3 PM1 = vec3(${f(pm1[0])},${f(pm1[1])},-3.2); const vec3 PM2 = vec3(${f(pm2[0])},${f(pm2[1])},-3.2);

// Blood pool SDF and wall SDF. id: 0 LV, 1 RV, 2 LA, 3 RA, 4 Ao, 5 PA, 6 veins, 7 annulus
struct H3 { float blood; float wall; int id; int bid; float lvEpi; float lvCav; };
H3 heartSDF(vec3 q){
  float lvC = max(sdEllipsoid(q - vec3(0,0,-2.5), vec3(2.5,2.5,5.6)), q.z - 0.05);
  float lvE = max(sdEllipsoid(q - vec3(0,0,-2.3), vec3(3.5,3.5,6.4)), q.z - 0.5);
  float ao = dAorta(q);
  float aoRoot = max(ao, -dot(q - AV_C, AV_N));
  float lvot = dLVOTc(q);
  float mc = sdCapsule(q, MV_C - MV_N*0.9, MV_C + MV_N*0.7, 1.6);
  mc = max(mc, -(aoRoot - 0.3));
  float rvRaw = sdEllipsoid(q - RV_C, vec3(2.6,2.4,3.8));
  float rvFill = min(sdCapsule(q, RV_C + vec3(0.0,0.0,1.0), TV_C, 1.35), sdCapsule(q, RV_C + vec3(0.0,0.0,1.0), RVOT0, 1.25));
  float rv = max(max(min(rvRaw, rvFill), -lvE), -(lvot - 0.35));
  rv = max(rv, -(dAorta(q) - 0.4));
  float sep = dot(q - SEP_P, SEP_N);
  float la = sdEllipsoid(q - LA_C, vec3(2.25,1.75,2.05));
  la = max(la, -(aoRoot - 0.45)); la = max(la, -lvE); la = max(la, -sep - 0.16);
  float ra = sdEllipsoid(q - RA_C, vec3(2.1,2.0,2.35));
  ra = max(ra, -(ao - 0.4)); ra = max(ra, sep - 0.16); ra = max(ra, -(rvRaw - 0.25)); ra = max(ra, -lvE);
  float tc = sdCapsule(q, TV_C - TV_N*0.8, TV_C + TV_N*0.7, 1.75); tc = max(tc, -lvE); tc = max(tc, -(ao-0.35));
  float rvot = max(max(dRVOTc(q), -(ao - 0.4)), -lvE);
  float pa = min(min(dPAm(q), dRPA(q)), dLPA(q)); pa = max(pa, -(ao - 0.35));
  float laa = max(dLAAc(q), -(pa - 0.3));
  float pv = dPVeins(q);
  float svc = max(dSVC(q), -(ao-0.35)); float ivc = dIVC(q);
  float pm = dPM(q);

  H3 r;
  float lv = min(min(lvC, lvot), mc);
  float b = lv; int bid = 0;
  if (rv < b) { b = rv; bid = 1; } if (rvot < b) { b = rvot; bid = 1; } if (tc < b) { b = tc; bid = 1; }
  if (la < b) { b = la; bid = 2; } if (laa < b) { b = laa; bid = 2; } if (pv < b) { b = pv; bid = 2; }
  if (ra < b) { b = ra; bid = 3; } if (svc < b) { b = svc; bid = 3; } if (ivc < b) { b = ivc; bid = 3; }
  if (ao < b) { b = ao; bid = 4; } if (pa < b) { b = pa; bid = 5; }
  b = max(b, -pm);
  r.bid = bid;
  r.blood = b; r.lvEpi = lvE; r.lvCav = lvC;
  // walls
  float w = lvE; int id = 0; float t;
  t = rv - 0.42;  if (t < w) { w = t; id = 1; }
  t = rvot - 0.38; if (t < w) { w = t; id = 1; }
  t = la - 0.26;  if (t < w) { w = t; id = 2; }
  t = laa - 0.2;  if (t < w) { w = t; id = 2; }
  t = ra - 0.26;  if (t < w) { w = t; id = 3; }
  t = ao - 0.26;  if (t < w) { w = t; id = 4; }
  t = pa - 0.2;   if (t < w) { w = t; id = 5; }
  t = min(svc, ivc) - 0.16; if (t < w) { w = t; id = 6; }
  t = pv - 0.16; if (t < w) { w = t; id = 8; }
  t = min(tc, mc) - 0.3; if (t < w) { w = t; id = 7; }
  t = lvot - 0.3; if (t < w) { w = t; id = 0; }
  t = pm; if (t < w) { w = t; id = 0; }
  r.wall = w; r.id = id;
  return r;
}

// ---- valves: distance to leaflet surfaces ----
float funnelValve(vec3 q, vec3 C, vec3 U, vec3 V, vec3 N, float R0, vec2 coapt, float open, float thClosed){
  vec3 w = q - C; float ax = dot(w, N); vec2 pl = vec2(dot(w,U), dot(w,V)) - coapt;
  float rho = length(pl); vec2 d = rho > 1e-4 ? pl/rho : vec2(1,0);
  float cd = dot(coapt, d); float R = -cd + sqrt(max(0.0, cd*cd - dot(coapt,coapt) + R0*R0));
  float th = mix(thClosed, 1.42, pow(open, 0.75));
  float L = R/cos(thClosed)*1.03;
  // leaflet bends: mid-point bulge toward the ventricle when closed
  vec2 Hh = vec2(R, 0.0), Tp = vec2(R - L*cos(th), -L*sin(th));
  vec2 M = mix(Hh, Tp, 0.5) + vec2(0.0, -0.18*(1.0-open));
  float dd = min(sdSeg2(vec2(rho, ax), Hh, M), sdSeg2(vec2(rho, ax), M, Tp));
  return dd - 0.02 - 0.05*smoothstep(0.4*L, L, length(vec2(rho,ax)-Hh));
}
float semilunar(vec3 q, vec3 C, vec3 U, vec3 V, vec3 N, float R, float open){
  vec3 w = q - C; float ax = dot(w, N); vec2 pl = vec2(dot(w,U), dot(w,V)); float rho = length(pl);
  vec2 tip = mix(vec2(0.05, 0.42), vec2(R - 0.16, 1.3), open);
  vec2 mid = mix(vec2(R*0.5, -0.05), vec2(R - 0.1, 0.65), open);
  float d1 = min(sdSeg2(vec2(rho, ax), vec2(R, 0.0), mid), sdSeg2(vec2(rho, ax), mid, tip));
  float dy = 1e3;
  for (int k = 0; k < 3; k++){
    float a = float(k)*2.0944 + 0.5;
    vec2 dir = vec2(cos(a), sin(a));
    float al = dot(pl, dir), pe = abs(dot(pl, vec2(-dir.y, dir.x)));
    if (al > 0.0 && al < R) dy = min(dy, max(pe, abs(ax - 0.22 - 0.2*(al/R)) - 0.2));
  }
  dy += open*2.0;
  return min(d1 - 0.03, dy - 0.02);
}
float valveSDF(vec3 q){
  float d = funnelValve(q, MV_C, MV_U, MV_V, MV_N, 1.6, vec2(-0.45, 0.0), uMV, 0.2);
  d = min(d, funnelValve(q, TV_C, TV_U, TV_V, TV_N, 1.75, vec2(0.0, 0.0), uTV, 0.22));
  d = min(d, semilunar(q, AV_C, AV_U, AV_V, AV_N, 1.12, uAV));
  d = min(d, semilunar(q, PV_C, PV_U, PV_V, PV_N, 1.12, uPV));
  return d;
}
// chordae from papillary heads to mitral leaflet free edges
float chordae(vec3 q){
  float th = mix(0.2, 1.22, uMV);
  float d = 1e3;
  for (int i = 0; i < 4; i++){
    vec3 pm = i < 2 ? PM1 : PM2;
    vec2 base = normalize(pm.xy - (MV_C.xy));
    float a = (i == 0 || i == 2) ? 0.45 : -0.45;
    vec2 dir = vec2(base.x*cos(a) - base.y*sin(a), base.x*sin(a) + base.y*cos(a));
    float R = 1.35;
    vec3 tip = MV_C + vec3(dir*(R - R*1.03*cos(th)) + vec2(-0.45,0.0)*0.0, 0.0) - MV_N*(R*1.03*sin(th));
    d = min(d, sdCapsule(q, pm, tip, 0.035));
  }
  return d;
}
`;
}

// ---- echo fragment shader ----
function echoFrag() {
  return `#version 300 es
${glslCommon()}
uniform vec2 uRes; uniform vec3 uO, uB, uL; uniform float uDepth, uHalf, uGain, uTee, uFrame, uDebug;
vec3 dbg = vec3(-1.0);
in vec2 vUv; out vec4 frag;

vec3 hash33(vec3 p){ p = vec3(dot(p,vec3(127.1,311.7,74.7)), dot(p,vec3(269.5,183.3,246.1)), dot(p,vec3(113.5,271.9,124.6))); return -1.0 + 2.0*fract(sin(p)*43758.5453123); }
float gnoise(vec3 p){
  vec3 i = floor(p), f = fract(p); vec3 u = f*f*(3.0-2.0*f);
  return mix(mix(mix(dot(hash33(i+vec3(0,0,0)),f-vec3(0,0,0)), dot(hash33(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                 mix(dot(hash33(i+vec3(0,1,0)),f-vec3(0,1,0)), dot(hash33(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
             mix(mix(dot(hash33(i+vec3(0,0,1)),f-vec3(0,0,1)), dot(hash33(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                 mix(dot(hash33(i+vec3(0,1,1)),f-vec3(0,1,1)), dot(hash33(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);
}
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }

// ---- body (unwarped) ----
const float RIB0 = 6.0; const float RIBS = 0.42;
float torsoE(vec3 p){ return pow((p.x+1.0)/16.0,2.0) + pow((p.y+1.0)/8.6,2.0); }
float skinDepth(vec3 p){ // approx distance below skin
  vec2 g = vec2((p.x+1.0)/256.0, (p.y+1.0)/73.96)*2.0; float f = torsoE(p) - 1.0; return -f/max(length(g),1e-4);
}
float diaZ(vec3 p){ return -6.2 - 0.010*pow(p.x+3.0,2.0) - 0.01*p.y*p.y; }
float heartEnv(vec3 p){ vec3 h = toH(p); return sdEllipsoid(h - vec3(-1.0,0.2,-1.7), vec3(5.4,5.0,7.9)); }
float boneAt(vec3 p){
  float sd = skinDepth(p);
  if (p.y < -1.0) { return length(vec2(p.x+1.0, p.y+10.2)) < 2.1 ? 1.0 : 0.0; }
  if (sd > 0.9 && sd < 2.2 && abs(p.x+1.2) < 1.2 && p.z > -8.6 && p.z < 9.0) return 1.0; // sternum
  float X = abs(p.x + 1.0);
  if (sd > 1.55 && sd < 2.4 && p.z > -9.6 && X > 1.0) {
    float kf = clamp(floor((RIB0 - RIBS*X - p.z)/3.3 + 0.5), 0.0, 6.0);
    float zk = RIB0 - 3.3*kf - RIBS*X;
    if (abs(p.z - zk) < 0.58) return 1.0;
  }
  return 0.0;
}
float lungAt(vec3 p){
  if (torsoE(p) > 1.0) return 0.0;
  if (skinDepth(p) < 2.45) return 0.0;
  if (p.z < diaZ(p) + 0.45 || p.z > 13.0) return 0.0;
  float rl = sdEllipsoid(p - vec3(-9.0,-1.5,2.5), vec3(7.2,8.0,10.5));
  float ll = sdEllipsoid(p - vec3(8.8,-2.0,2.5), vec3(6.6,7.6,10.0));
  if (min(rl, ll) > 0.0) return 0.0;
  if (heartEnv(p) < 0.4) return 0.0;
  if (sdCapsule(p, vec3(0.4,6.8,2.6), vec3(7.4,5.0,-7.6), 3.3) < 0.0) return 0.0; // cardiac notch
  if (length(vec2(p.x-1.6, p.y+6.0)) < 2.2 || length(vec2(p.x+0.4, p.y+5.1)) < 1.8) return 0.0; // aorta, esophagus
  if (abs(p.x+1.0) < 3.2 && p.y < -7.0) return 0.0; // spine
  if (abs(p.x+1.5) < 2.6 && p.z > 2.0 && p.y > -6.0 && p.y < 3.5) return 0.0; // superior mediastinum
  return 1.0;
}

float hash31(vec3 p){ p = fract(p*vec3(0.1031,0.1030,0.0973)); p += dot(p, p.yxz+33.33); return fract((p.x+p.y)*p.z); }
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p); vec3 u = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash31(i), hash31(i+vec3(1,0,0)), u.x), mix(hash31(i+vec3(0,1,0)), hash31(i+vec3(1,1,0)), u.x), u.y),
             mix(mix(hash31(i+vec3(0,0,1)), hash31(i+vec3(1,0,1)), u.x), mix(hash31(i+vec3(0,1,1)), hash31(i+vec3(1,1,1)), u.x), u.y), u.z);
}
float speck(vec3 m, vec3 Bm, vec3 Lm, vec3 Nm, float r){
  float fl = 3.4/(1.0 + 0.045*r);
  vec3 x = vec3(dot(m,Bm)*7.5, dot(m,Lm)*fl, dot(m,Nm)*4.0);
  float a = vnoise(x), b = vnoise(x*1.9 + vec3(5.2,1.3,7.7));
  float c = vnoise(x*0.45 + vec3(2.1,9.4,3.3));
  float v = a*0.65 + b*0.35;
  return pow(v, 2.2)*3.6*(0.75 + 0.5*c);
}
void main(){
  vec2 fc = vUv*uRes;
  float topPad = uRes.y*0.035;
  float pxPerCm = (uRes.y - topPad - uRes.y*0.15)/uDepth;
  vec2 o = vec2(uRes.x*0.5, uRes.y - topPad);
  vec2 v = vec2(fc.x - o.x, o.y - fc.y)/pxPerCm;
  float r = length(v); float a = atan(v.x, v.y);
  float apod = smoothstep(uHalf, uHalf - 0.025, abs(a));
  if (r > uDepth || abs(a) > uHalf || v.y < -0.1) { frag = vec4(0,0,0,1); return; }
  vec3 dir = normalize(cos(a)*uB + sin(a)*uL);
  vec3 P = uO + r*dir;
  vec3 N = normalize(cross(uB, uL));

  // transmission along the scan line
  float T = 1.0; float airD = -1.0; float boneHit = 0.0; float boneLen = 0.0;
  if (uTee < 0.5) {
    float rmax = min(r, 3.0); float firstR = -1.0;
    for (int i = 1; i <= 36; i++){
      float ri = rmax*float(i)/36.0;
      if (boneAt(uO + ri*dir) > 0.5) { boneLen += rmax/36.0; if (firstR < 0.0) firstR = ri; }
    }
    if (firstR > 0.0) {
      float lo = firstR - rmax/36.0, hi = firstR;
      for (int j = 0; j < 5; j++){ float m = 0.5*(lo+hi); if (boneAt(uO + m*dir) > 0.5) hi = m; else lo = m; }
      boneHit = hi;
    }
    T *= exp(-3.2*boneLen);
  }
  { // spine: vertical cylinder
    vec2 oc = uO.xy - vec2(-1.0,-10.2); vec2 dd = dir.xy; float A2 = dot(dd,dd), B2 = dot(oc,dd), C2 = dot(oc,oc) - 4.41;
    float disc = B2*B2 - A2*C2;
    if (disc > 0.0 && A2 > 1e-5) { float ts = (-B2 - sqrt(disc))/A2; if (ts > 0.0 && ts < r) { T *= 0.06; if (boneHit == 0.0) boneHit = ts; } }
  }
  {
    float prevR = 0.0, ri = 0.0, hit = -1.0;
    for (int i = 0; i < 64; i++){
      ri += 0.35; if (ri > r) break;

      prevR = ri;
    }
    if (hit > 0.0) {
      float lo = prevR, hi = hit;
      for (int j = 0; j < 6; j++){ float m = 0.5*(lo+hi); if (lungAt(uO + m*dir) > 0.5) hi = m; else lo = m; }
      airD = hi;
    }
  }
  float boneSurf = (boneHit > 0.0 && r > boneHit - 0.05 && r < boneHit + 0.22) ? 1.0 : 0.0;

  vec3 Bh = toH(uB), Lh = toH(uL), Nh = toH(N);
  float sd = skinDepth(P);
  // ---- body tissues (unwarped) ----
  float Eb = 0.2; float spb = speck(P, uB, uL, N, r);
  {
    if (torsoE(P) > 1.0) Eb = 0.0;
    else if (uTee < 0.5 && sd < 0.18) Eb = 0.85;
    else if (uTee < 0.5 && sd < 1.0) Eb = 0.26 + 0.42*smoothstep(0.7,1.0, sin(sd*9.0 + 0.5*sin(P.x*0.7+P.z*0.5)));
    else if (uTee < 0.5 && sd < 1.6) Eb = 0.42 + 0.16*sin(sd*22.0 + P.x);
    else {
      float dz = P.z - diaZ(P);
      bool belowD = dz < 0.0;
      float ivc = dIVC(toH(P));
      float hv = 1e3;
${AN.hv.map((s) => `      hv = min(hv, sdRoundCone(P, ${v3(s[0])}, ${v3(s[1])}, 0.55, 0.3));`).join('\n')}
      float dao = sdCapsule(P, vec3(1.6,-6.0,-20.0), vec3(1.6,-6.0,3.0), 1.15);
      float eso = length(vec2(P.x+0.4, P.y+5.1)) - 0.85;
      float stom = sdEllipsoid(P - vec3(5.0,-1.6,-11.6), vec3(4.6,3.6,3.4));
      float liver = sdEllipsoid(P - vec3(-3.2,1.0,-12.5), vec3(9.5,7.0,6.6));

      else if (dao < 0.0) Eb = 0.015;
      else if (dao < 0.22) Eb = 0.75;
      else if (eso < 0.0) Eb = 0.45;
      else if (vess < 0.0) Eb = 0.015;
      else if (vess < 0.1) Eb = 0.7;
      else if (belowD && liver < 0.0) { Eb = 0.3; spb = 0.45 + 0.65*spb; }
      else if (belowD && stom < 0.0) Eb = stom > -0.4 ? 0.55 : 0.14;
      else if (belowD) Eb = 0.24;
      else Eb = 0.11;
    }
  }
  float E = Eb; float sp = spb; float specB = 0.0;

  vec3 q = warpInv(toH(P));

    float shell = exp(-pow((peri + 0.06)/max(wP*0.9, 0.05), 2.0));
    float Esac = 0.2 + 1.1*shell;
    float wallF = smoothstep(wW, -wW, s.wall);
    float bloodF = smoothstep(wB, -wB, bl);

      host.appendChild(w);
      const inp = w.querySelector('input');
      const set = (v) => { v = Math.max(d.min, Math.min(d.max, v)); st[st.mode][d.k] = v; inp.value = v; $(`${id}_v`).textContent = d.fmt(v); dirty = true; };
      inp.addEventListener('input', () => set(parseFloat(inp.value)));
      w.querySelectorAll('.nudge').forEach((b) => b.addEventListener('click', () => set(st[st.mode][d.k] + d.nudge * parseFloat(b.dataset.d))));
      slEls[d.k] = { inp, out: $(`${id}_v`), d };
    }
    syncSliders();
  }
  function syncSliders() { for (const k in slEls) { const { inp, out, d } = slEls[k]; const v = st[st.mode][k]; inp.value = v; out.textContent = d.fmt(v); } }
  function buildViews() {
    const host = $('views'); host.innerHTML = '';
    const names = st.mode === 'tte' ? Object.keys(TTE) : Object.keys(TEE);
    for (const n of names) {
      const b = document.createElement('button'); b.className = 'chip'; b.textContent = n; b.dataset.v = n;
      b.addEventListener('click', () => { setView(n); });
      host.appendChild(b);
    }
    markView();
  }
  function markView() { const v = st[st.mode].view; document.querySelectorAll('#views .chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }
  function setView(n) {
    if (st.mode === 'tte') Object.assign(st.tte, { view: n, dx: 0, dz: 0, rot: 0, tilt: 0, rock: 0, depth: TTE[n].depth });
    else Object.assign(st.tee, { view: n, ...pick(TEE[n]), D: TEE[n].D });
    syncSliders(); markView(); dirty = true;
  }
  function setMode(m) {
    st.mode = m; $('mTTE').setAttribute('aria-pressed', String(m === 'tte')); $('mTEE').setAttribute('aria-pressed', String(m === 'tee'));
    $('viewsTitle').textContent = m === 'tte' ? 'TTE views' : 'TEE views (ASE/SCA)';
    st.cam = m === 'tte' ? { yaw: 0.75, pitch: 0.38, dist: 56 } : { yaw: 2.3, pitch: 0.25, dist: 40 };
    buildViews(); buildSliders(); dirty = true;
  }
  $('mTTE').addEventListener('click', () => setMode('tte'));
  $('mTEE').addEventListener('click', () => setMode('tee'));
  $('play').addEventListener('click', () => { st.playing = !st.playing; $('play').textContent = st.playing ? 'Pause' : 'Play'; $('play').setAttribute('aria-pressed', String(st.playing)); dirty = true; });
  $('hr').addEventListener('input', (e) => { st.hr = +e.target.value; $('hrV').textContent = st.hr + ' bpm'; });
  $('gain').addEventListener('input', (e) => { st.gain = +e.target.value; $('gainV').textContent = st.gain; dirty = true; });
  const toggle = (id, key) => $(id).addEventListener('click', () => { st[key] = !st[key]; $(id).setAttribute('aria-pressed', String(st[key])); dirty = true; });
  toggle('labels', 'labels'); toggle('cut', 'cut'); toggle('skin', 'skin');
  $('reset3').addEventListener('click', () => { st.cam = st.mode === 'tte' ? { yaw: 0.75, pitch: 0.38, dist: 56 } : { yaw: 2.3, pitch: 0.25, dist: 40 }; dirty = true; });

  // 3D orbit
  const ptrs = new Map(); let pinch0 = 0;
  const v3 = $('v3');
  v3.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; v3.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); v3.style.cursor = 'grabbing'; });
  v3.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const p = ptrs.get(e.pointerId);
    if (ptrs.size === 1) {
      st.cam.yaw -= (e.clientX - p.x) * 0.008; st.cam.pitch = Math.max(-1.4, Math.min(1.4, st.cam.pitch + (e.clientY - p.y) * 0.008));
    }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch0) st.cam.dist = Math.max(15, Math.min(90, st.cam.dist * pinch0 / d));
      pinch0 = d;
    }
    dirty = true;
  });
  const up = (e) => { ptrs.delete(e.pointerId); pinch0 = 0; v3.style.cursor = 'grab'; };
  v3.addEventListener('pointerup', up); v3.addEventListener('pointercancel', up);
  v3.addEventListener('wheel', (e) => { e.preventDefault(); st.cam.dist = Math.max(15, Math.min(90, st.cam.dist * Math.exp(e.deltaY * 0.001))); dirty = true; }, { passive: false });

  // ---- sizing ----
  let scale3 = 0.6;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = $('scope').getBoundingClientRect();
    const w = Math.min(Math.round(r.width * dpr), 1000), h = Math.round(w * r.height / r.width);
    if (echoCv.width !== w || echoCv.height !== h) { echoCv.width = w; echoCv.height = h; ovCv.width = w; ovCv.height = h; ecgBuf = new Float32Array(w).fill(NaN); }
    const r3 = v3.getBoundingClientRect();
    const w3 = Math.max(160, Math.round(r3.width * dpr * scale3)), h3 = Math.max(120, Math.round(w3 * r3.height / r3.width));
    if (c3.width !== w3 || c3.height !== h3) { c3.width = w3; c3.height = h3; }
    dirty = true;
  }
  window.addEventListener('resize', resize);

  // ---- rendering ----
  let dirty = true, frame = 0, ecgBuf = null, ecgX = 0, lastT = performance.now(), fpsAcc = 0, fps = 0, slow = 0;
  function renderEcho(p, c) {
    const U = PE.U; gl.useProgram(PE.p);
    gl.uniform1f(U('uS'), c.S); gl.uniform1f(U('uDesc'), c.desc); gl.uniform1f(U('uMV'), c.MV); gl.uniform1f(U('uTV'), c.TV); gl.uniform1f(U('uAV'), c.AV); gl.uniform1f(U('uPV'), c.PV);
    gl.uniform1f(U('uTime'), st.time); gl.uniform2f(U('uRes'), echoCv.width, echoCv.height);
    gl.uniform3fv(U('uO'), p.O); gl.uniform3fv(U('uB'), p.B); gl.uniform3fv(U('uL'), p.L);
    gl.uniform1f(U('uDepth'), p.D); gl.uniform1f(U('uHalf'), 0.785); gl.uniform1f(U('uGain'), Math.pow(2, (st.gain - 50) / 22));
    gl.uniform1f(U('uTee'), st.mode === 'tee' ? 1 : 0); gl.uniform1f(U('uFrame'), frame % 97); gl.uniform1f(U('uDebug'), 0);
    gl.viewport(0, 0, echoCv.width, echoCv.height); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  function render3D(p, c) {
    const U = P3.U; g3.useProgram(P3.p);
    g3.bindTexture(g3.TEXTURE_2D, tex);
    try { g3.texImage2D(g3.TEXTURE_2D, 0, g3.RGBA, g3.RGBA, g3.UNSIGNED_BYTE, echoCv); } catch (e) { }
    g3.uniform1i(U('uEcho'), 0);
    g3.uniform1f(U('uS'), c.S); g3.uniform1f(U('uDesc'), c.desc); g3.uniform1f(U('uMV'), c.MV); g3.uniform1f(U('uTV'), c.TV); g3.uniform1f(U('uAV'), c.AV); g3.uniform1f(U('uPV'), c.PV);
    const cam = st.cam, tgt = st.mode === 'tte' ? [1.5, 2.0, -3.0] : [0.5, -2.0, -2.0];
    const dir = [Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.cos(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch)];
    const pos = V3.add(tgt, V3.mul(dir, cam.dist));
    const F = V3.norm(V3.sub(tgt, pos)); const R = V3.norm(V3.cross([0, 0, 1], F)); const Up = V3.cross(F, R);
    g3.uniform2f(U('uRes'), c3.width, c3.height); g3.uniform3fv(U('uCam'), pos); g3.uniform3fv(U('uCamF'), F); g3.uniform3fv(U('uCamR'), R); g3.uniform3fv(U('uCamU'), Up); g3.uniform1f(U('uFov'), 0.75);
    g3.uniform3fv(U('uO'), p.O); g3.uniform3fv(U('uB'), p.B); g3.uniform3fv(U('uL'), p.L); g3.uniform1f(U('uDepth'), p.D); g3.uniform1f(U('uHalf'), 0.785);
    const N = V3.norm(V3.cross(p.B, p.L));
    g3.uniform1f(U('uCut'), st.cut ? 1 : 0); g3.uniform1f(U('uSide'), Math.sign(V3.dot(N, V3.sub(pos, p.O))) || 1); g3.uniform1f(U('uTee'), st.mode === 'tee' ? 1 : 0); g3.uniform1f(U('uShowTorso'), st.skin ? 1 : 0);
    g3.uniform3fv(U('uPS'), p.O); g3.uniform3fv(U('uPB'), p.B); g3.uniform3fv(U('uPL'), p.L);
    if (st.mode === 'tee') {
      const pts = [], sJoint = st.tee.depth - 2.2 - AN.esoDepth0; let acc = 0; const P = AN.esoPath;
      pts.push(P[0]);
      for (let i = 0; i < P.length - 1 && pts.length < 7; i++) { const L = V3.len(V3.sub(P[i + 1], P[i])); if (acc + L < sJoint) { pts.push(P[i + 1]); acc += L; } else break; }
      pts.push(p.joint);
      const flat = new Float32Array(24); pts.forEach((q, i) => flat.set(q, i * 3));
      g3.uniform3fv(U('uTube'), flat); g3.uniform1i(U('uTubeN'), pts.length);
      g3.uniform3fv(U('uJ'), p.joint); g3.uniform3fv(U('uTipDir'), p.tipDir); g3.uniform3fv(U('uTipB'), p.B);
    } else { g3.uniform1i(U('uTubeN'), 0); }
    g3.viewport(0, 0, c3.width, c3.height); g3.drawArrays(g3.TRIANGLE_STRIP, 0, 4);
  }

  const ctx = ovCv.getContext('2d');
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  const COL = { accent: css('--accent'), marker: css('--marker'), ecg: css('--ecg'), muted: css('--muted') };
  function drawOverlay(p, near) {
    const W = ovCv.width, H = ovCv.height, s = Math.max(W / 640, Math.min(window.devicePixelRatio || 1, 2) * 0.95);
    ctx.clearRect(0, 0, W, H);
    const top = H * 0.035, ppc = (H - top - H * 0.15) / p.D, ox = W / 2;
    ctx.font = `${Math.round(12 * s)}px "IBM Plex Mono", monospace`; ctx.textBaseline = 'top';
    // index marker
    ctx.fillStyle = COL.marker; ctx.beginPath(); ctx.arc(ox + p.D * ppc * Math.sin(0.785) * 0.18 + 10 * s, top + 4 * s, 4.5 * s, 0, Math.PI * 2); ctx.fill();
    // depth scale on the right
    ctx.strokeStyle = 'rgba(220,230,232,0.7)'; ctx.fillStyle = 'rgba(220,230,232,0.75)'; ctx.lineWidth = Math.max(1, s);
    const xr = W - 22 * s;
    for (let d = 0; d <= p.D + 0.01; d += 1) { const y = top + d * ppc; const big = d % 5 === 0; ctx.beginPath(); ctx.moveTo(xr - (big ? 8 : 4) * s, y); ctx.lineTo(xr, y); ctx.stroke(); if (big && d > 0) { ctx.textAlign = 'right'; ctx.fillText(String(d), xr - 10 * s, y - 6 * s); } }
    ctx.textAlign = 'left';
    // header text
    ctx.fillStyle = '#dfe6e8';
    ctx.font = `600 ${Math.round(13 * s)}px "IBM Plex Sans Condensed", sans-serif`;
    ctx.fillText(st.mode === 'tte' ? 'TTE  2.5 MHz' : 'TEE  5.0 MHz', 12 * s, 10 * s);
    ctx.font = `${Math.round(11.5 * s)}px "IBM Plex Mono", monospace`; ctx.fillStyle = 'rgba(220,230,232,0.8)';
    ctx.fillText(`D ${p.D.toFixed(1)} cm`, 12 * s, 30 * s);
    ctx.fillText(`G ${st.gain}`, 12 * s, 46 * s);
    ctx.fillText(`${Math.round(fps) || '--'} Hz`, 12 * s, 62 * s);
    if (near) {
      ctx.fillStyle = near.s < 1.6 ? COL.accent : COL.muted;
      ctx.textAlign = 'right'; ctx.font = `600 ${Math.round(13 * s)}px "IBM Plex Sans Condensed", sans-serif`;
      ctx.fillText(near.s < 1.6 ? near.k : 'Off-axis', W - 40 * s, 10 * s);
      ctx.textAlign = 'left';
    }
    if (st.mode === 'tee') { // omniplane icon: circle with the imaging plane as a diameter
      const cx = W - 70 * s, cy = 50 * s, rr = 14 * s, w = st.tee.omni * Math.PI / 180;
      ctx.strokeStyle = 'rgba(220,230,232,0.7)'; ctx.lineWidth = Math.max(1, s); ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = COL.marker; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(cx - rr * Math.cos(w), cy - rr * Math.sin(w)); ctx.lineTo(cx + rr * Math.cos(w), cy + rr * Math.sin(w)); ctx.stroke();
      ctx.fillStyle = COL.marker; ctx.beginPath(); ctx.arc(cx + rr * Math.cos(w), cy + rr * Math.sin(w), 3 * s, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = Math.max(1, s); ctx.fillStyle = '#dfe6e8'; ctx.textAlign = 'center'; ctx.fillText(`${Math.round(st.tee.omni)}°`, cx, cy + rr + 5 * s); ctx.textAlign = 'left';
    }
    // labels
    if (st.labels) {
      const N = V3.norm(V3.cross(p.B, p.L));
      ctx.font = `600 ${Math.round(12 * s)}px "IBM Plex Sans", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const [name, X, rad] of LABELS) {
        const v = V3.sub(X, p.O); const dn = V3.dot(v, N); if (Math.abs(dn) > rad * 0.8) continue;
        const al = V3.dot(v, p.B), la = V3.dot(v, p.L), r = Math.hypot(al, la), a = Math.atan2(la, al);
        if (al < 0.8 || r > p.D - 0.4 || Math.abs(a) > 0.72) continue;
        const x = ox + la * ppc, y = top + al * ppc;
        ctx.lineWidth = 3 * s; ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.strokeText(name, x, y); ctx.fillStyle = '#ffffff'; ctx.fillText(name, x, y);
      }
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    }
    // ECG strip
    const ey = H * 0.915, eh = H * 0.06;
    ctx.strokeStyle = COL.ecg; ctx.lineWidth = 1.6 * s; ctx.beginPath();
    let pen = false;
    for (let x = 0; x < W; x += 2) { const v = ecgBuf[x]; if (isNaN(v) || Math.abs(x - ecgX) < 10 * s) { pen = false; continue; } const y = ey - v * eh; if (!pen) { ctx.moveTo(x, y); pen = true; } else ctx.lineTo(x, y); }
    ctx.stroke();
    ctx.fillStyle = COL.ecg; ctx.font = `${Math.round(12 * s)}px "IBM Plex Mono", monospace`; ctx.fillText(`HR ${st.hr}`, 12 * s, H * 0.86);
  }

  function tick(now) {
    const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
    if (st.playing) {
      const prev = st.phase;
      st.phase = (st.phase + dt * st.hr / 60) % 1; st.time += dt;
      // sweep the ECG: 3 s across the screen
      if (ecgBuf) {
        const W = ecgBuf.length, nx = (ecgX + dt / 3 * W);
        for (let x = Math.floor(ecgX); x < Math.floor(nx); x++) { const f = (x - ecgX) / Math.max(1e-6, nx - ecgX); ecgBuf[x % W] = ecg((prev + (st.phase - prev + (st.phase < prev ? 1 : 0)) * f) % 1); }
        ecgX = nx % W;
      }
      dirty = true;
    }
    if (dirty && echoCv.width > 0) {
      const t0 = performance.now();
      const p = curPose(), c = cyc(st.phase);
      renderEcho(p, c); render3D(p, c);
      const near = nearest(p);
      drawOverlay(p, near);
      const nEl = $('near'); nEl.textContent = near.s < 1.6 ? `Nearest: ${near.k}` : 'Off-axis'; nEl.className = 'near' + (near.s < 1.6 ? '' : ' off');
      frame++; dirty = false;
      fpsAcc = fpsAcc * 0.9 + dt * 0.1; fps = fpsAcc > 0 ? 1 / fpsAcc : 0;
      // adaptive 3D resolution
      if (st.playing && frame > 30) { if (fps < 24) slow++; else slow = Math.max(0, slow - 1); if (slow > 40 && scale3 > 0.3) { scale3 -= 0.1; slow = 0; resize(); } }
    }
    requestAnimationFrame(tick);
  }
  // initial
  setMode('tte');
  setView('A4C');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { st.playing = false; $('play').textContent = 'Play'; $('play').setAttribute('aria-pressed', 'false'); }
  resize();
  requestAnimationFrame(tick);
  // tell an embedding page (pulmonarypocus.com) how tall the simulator is, so its iframe fits without scrolling
  if (window.parent !== window) {
    const post = () => { try { window.parent.postMessage({ lab: 'echo-sim', labHeight: Math.ceil(document.documentElement.scrollHeight) }, '*'); } catch (e) { } };
    try { new ResizeObserver(post).observe(document.body); } catch (e) { }
    window.addEventListener('load', post); setTimeout(post, 300); setTimeout(post, 1500);
  }
  window.__sim = { st, setMode, setView, TTE, TEE };
})();

</script>
