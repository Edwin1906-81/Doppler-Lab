<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critical Care Echo Board Dashboard</title>
<!--
  Fellow echo board dashboard. Data: "Fellow Echo Credentialing Dashboard (Live)" Google Sheet, Dashboard tab (published CSV).
  Admin edits go in that sheet's Admin tab: cceexam (Registered/Passed), exam_date, log_signed, letter, boards (yes), note, verified_on.
-->
<style>
  :root{
    --bg:#f7f5f2; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e6e2dc; --soft:#f1ede7;
    --accent:#990000; --accent-soft:#f6e6e6; --gold:#c99a2e; --gold-soft:#fbf3df;
    --lung:#0f9b8e; --cardiac:#c8102e; --vascular:#4f46e5; --abdominal:#d97706;
    --ok:#15803d; --ok-soft:#e5f4ea; --warn:#b45309; --warn-soft:#fdf1e1; --bad:#b91c1c; --bad-soft:#fbe9e9;
    --track:#ebe7e1; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  }
  :root[data-theme="dark"]{
    --bg:#16161a; --panel:#1f1f24; --ink:#f2f2f4; --muted:#a3a3ab; --line:#2f2f36; --soft:#26262c;
    --accent:#e0565b; --accent-soft:#3a2224; --gold:#e5bd5c; --gold-soft:#3a3120;
    --track:#2e2e35; --ok-soft:#1d3326; --warn-soft:#3a2d1a; --bad-soft:#3a1f1f; --shadow:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:20px 16px 32px}
  button{font:inherit;color:inherit}
  a{color:var(--accent)}

  /* Hero */
  .hero{background:linear-gradient(135deg,#7a0000,#990000 55%,#b3262b);color:#fff;border-radius:18px;padding:22px 22px 18px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;
    border:28px solid rgba(255,255,255,.07)}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
  .hero h1{margin:4px 0 2px;font-size:26px;line-height:1.15}
  .hero .sub{opacity:.85;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
  .stat{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}
  .stat b{display:block;font-size:24px;line-height:1.1}
  .stat span{font-size:12px;opacity:.85}

  /* Cohort mix */
  .mix{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px}
  .mixc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
  .mixc .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .mixc .num{font-size:20px;font-weight:700}
  .mixc .lead{font-size:12px;color:var(--muted);margin-top:2px}
  .bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;border-radius:99px}

  /* Toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 12px}
  .toolbar h2{font-size:18px;margin:0 auto 0 0}
  .seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
  input[type=search],select{font:inherit;font-size:13px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  input[type=search]{width:170px}

  /* Cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;box-shadow:var(--shadow);
    transition:transform .15s,border-color .15s}
  .card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--accent)}
  .card.open{border-color:var(--accent);outline:2px solid var(--accent-soft)}
  .card.cred{background:linear-gradient(180deg,var(--gold-soft),var(--panel) 60%);border-color:var(--gold)}
  .name{font-weight:700;font-size:15px}
  .meta{font-size:12px;color:var(--muted)}
  .dots{display:flex;gap:5px}
  .dot{width:22px;height:6px;border-radius:99px;background:var(--track)}
  .dot.done{background:var(--accent)} .dot.part{background:linear-gradient(90deg,var(--accent) 50%,var(--track) 50%)}
  .cred .dot.done{background:var(--gold)}
  .pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px}
  .p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
  .p-bad{background:var(--bad-soft);color:var(--bad)} .p-gold{background:var(--gold-soft);color:#8a6510}
  :root[data-theme="dark"] .p-gold{color:var(--gold)}
  .p-new{background:var(--soft);color:var(--muted)}

  /* Detail */
  .detail{grid-column:1/-1;background:var(--panel);border:1px solid var(--accent);border-radius:18px;padding:18px;
    position:relative;overflow:hidden;box-shadow:var(--shadow);animation:pop .22s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dhead h3{margin:0;font-size:20px}
  .x{margin-left:auto;border:0;background:var(--soft);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:18px}
  .dgrid{display:grid;grid-template-columns:230px 1fr 1fr;gap:20px;margin-top:14px}
  .sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;margin-top:8px}
  .legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
  .cat{margin-bottom:11px}
  .cat .row{display:flex;justify-content:space-between;font-size:13px}
  .cat .row b{font-weight:600}
  .cat .togo{font-size:12px;color:var(--muted)}
  .cat .bar{height:10px;position:relative}
  .step{display:flex;gap:10px;padding:7px 0;position:relative}
  .step:not(:last-child):before{content:"";position:absolute;left:13px;top:34px;bottom:-4px;width:2px;background:var(--track)}
  .step.done:not(:last-child):before{background:var(--accent)}
  .ico{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;
    background:var(--track);color:var(--muted)}
  .step.done .ico{background:var(--accent);color:#fff}
  .step.part .ico{background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent)}
  .step .t{font-size:14px;font-weight:600}
  .step .s{font-size:12.5px;color:var(--muted)}
  .medal{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:4px;vertical-align:1px}
  .m-Silver{background:#e7e9ee;color:#4b5563} .m-Gold{background:#fbefc9;color:#8a6510} .m-Platinum{background:#dfeef3;color:#1f5b6e}
  .next{margin:0;padding-left:18px;font-size:13.5px}
  .next li{margin-bottom:4px}
  .note{margin-top:10px;font-size:13px;background:var(--soft);border-radius:10px;padding:8px 10px}
  .pace svg{width:100%;height:auto;display:block}
  .pace p{font-size:13px;margin:6px 0 0}
  .confetti{position:absolute;inset:0;pointer-events:none}
  .confetti i{position:absolute;top:-10px;width:7px;height:11px;border-radius:2px;animation:fall 2.4s ease-in forwards}
  @keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
  .banner{display:flex;gap:8px;align-items:center;background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink);
    border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}

  /* Table */
  .tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
  th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--soft)}
  th:first-child,td:first-child{text-align:left}
  tbody tr.r{cursor:pointer} tbody tr.r:hover td{background:var(--soft)}
  td.h{font-weight:600;color:var(--ink)}
  td.dt{padding:0;border:0} td.dt .detail{border-radius:0;border-width:0 0 1px 0;text-align:left}

  /* Requirements */
  .reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:6px}
  details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary .ico{background:var(--accent);color:#fff}
  details[open] summary{margin-bottom:6px}
  details p,details ul{font-size:13.5px;margin:6px 0 0;color:var(--muted)}
  details ul{padding-left:18px}
  .foot{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
  .up{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;box-shadow:var(--shadow)}
  .up summary{font-size:15px}
  .up .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
  .up .st{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
  .up .st b{display:block;margin-bottom:6px}
  .up .btn{display:inline-block;border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;font-size:13.5px}
  .up .btn[disabled]{opacity:.5;cursor:not-allowed}
  .up input[type=text],.up select{font:inherit;font-size:13px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .up table{min-width:0;margin-top:8px;font-size:12.5px}
  .up th,.up td{padding:6px 4px;font-size:11.5px}
  .up .msg{margin-top:10px;font-size:13px;border-radius:10px;padding:8px 10px}
  .up .ok{background:var(--ok-soft);color:var(--ok)} .up .err{background:var(--bad-soft);color:var(--bad)}
  .how{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
  .how h2{font-size:18px;margin:0 0 10px}
  .how ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .how li{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
  .how li .ico{background:var(--accent);color:#fff}
  .how li b{display:block}
  .phi{margin-top:12px;border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px}
  .phi strong{font-size:16px;letter-spacing:.04em;display:block;margin-bottom:2px}
  .empty{padding:30px;text-align:center;color:var(--muted)}

  @media (max-width:820px){
    .dgrid{grid-template-columns:1fr}
    .ringbox{display:flex;flex-direction:column;align-items:center}
    .stats,.mix{grid-template-columns:repeat(2,1fr)}
    .toolbar h2{width:100%}
    input[type=search]{flex:1;min-width:0}
  }
  @media (max-width:440px){ .grid{grid-template-columns:repeat(2,1fr);gap:8px} .card{padding:10px} .hero h1{font-size:22px} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================== EDIT HERE ============================== */
const CONFIG = {
  title: "Critical Care Echo Board Dashboard",
  program: "IU Pulmonary & Critical Care Medicine Fellowship",
  academicYear: "2026-27",
  ayStart: "2026-07-01",
  fellowshipYears: 3,                 // length of fellowship; sets each fellow's graduation date from their year
  nextExam: "2027-01-26",             // next CCEeXAM date (NBE)
  lastUpdated: "2026-10-30",
  sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQSH75NLuzZAefszLM-COLz5UGTt3IwbjNX7L5vM4TQmd9RmrWFfGHDLK04rmOhyILUbYrZPksMoHGT/pub?gid=1552785516&single=true&output=csv",
  uploadFormUrl: "https://docs.google.com/forms/d/e/1FAIpQLSc8s1GPOZxvIE_Ssi0LNfeourss1-dbsQQwYVW280fdPEnuPg/formResponse",
  uploadNameField: "entry.1998879290",
  uploadDataField: "entry.698563734",
  theme: "light",
  logUrl: "https://www.pulmonarypocus.com/s/Critical_Care_Echo_Case_Log.xlsx",
  contact: "pulmonarypocus@gmail.com",
  req: { tte: 150 }
};
/* ======================================================================= */

const R = CONFIG.req, DAY = 864e5;
let data = [], view = "cards", sortBy = "progress", yrFilter = "all", query = "", openIdx = null, parsed = null;

const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pd = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const fmt = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const pct = f => Math.round(f*100);
const truthy = v => v === true || /^(y|yes|true|1|x|done|signed|received)$/i.test(String(v).trim());

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if (ch==='"') q=true;
    else if (ch===','){ row.push(f); f=""; }
    else if (ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=ch;
  }
  if (f||row.length){ row.push(f); rows.push(row); }
  const head = rows.shift().map(h=>h.trim().toLowerCase().replace(/[^a-z_]/g,""));
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>{ const o={}; head.forEach((h,j)=>o[h]=r[j]); return o; });
}
function normalize(r){
  const ex = String(r.cceexam||"").trim().toLowerCase();
  return {
    name: String(r.name||"").trim(),
    year: parseInt(String(r.year||"").replace(/\D/g,"")) || null,
    logged: +r.logged||0, qualifying: +r.qualifying||0, reviewed: +r.reviewed||0, concordant: +r.concordant||0,
    exam: /pass|testamur/.test(ex) ? "Passed" : /regist|sched/.test(ex) ? "Registered" : "",
    examDate: String(r.exam_date||"").trim(),
    logSigned: truthy(r.log_signed), letter: truthy(r.letter), boards: truthy(r.boards),
    note: String(r.note||"").trim(), uploaded: String(r.uploaded||"").trim(), pending: truthy(r.pending)
  };
}

function compute(r){
  const q = r.qualifying, f = Math.min(q/R.tte,1);
  const yr = r.year || 1, ay0 = pd(CONFIG.ayStart);
  const start = new Date(ay0.getFullYear()-(yr-1), 6, 1);
  const target = new Date(ay0.getFullYear()+1+(CONFIG.fellowshipYears-yr), 5, 30);
  const today = new Date();
  const steps = [
    {t:`${R.tte} qualifying critical care TTEs`, done:q>=R.tte, part:q>0, s:`${q} of ${R.tte} complete, performed and interpreted`},
    {t:"Pass the CCEeXAM", done:r.exam==="Passed", part:r.exam==="Registered",
      s: r.exam==="Passed" ? `Testamur${r.examDate?`, ${fmt(pd(r.examDate))}`:""}` : r.exam==="Registered" ? `Registered${r.examDate?` for ${fmt(pd(r.examDate))}`:""}` : `Next exam ${fmt(pd(CONFIG.nextExam))}`},
    {t:"Case log signed by fellowship director", done:r.logSigned, part:false, s:r.logSigned?"Signed":"At or near graduation"},
    {t:"Notarized fellowship director letter", done:r.letter, part:false, s:r.letter?"Received":"States your exact case numbers"},
    {t:"Board certification and license", done:r.boards, part:false, s:r.boards?"Documented":"After fellowship"}
  ];
  const doneCount = steps.filter(s=>s.done).length, ready = doneCount===steps.length;
  const overall = .6*f + .1*(r.exam==="Passed"?1:r.exam==="Registered"?.4:0) + .1*r.logSigned + .1*r.letter + .1*r.boards;
  const elapsed = Math.max(1,(today-start)/DAY), remaining = Math.max(0,R.tte-q);
  const perWeek = q/elapsed*7, weeksLeft = Math.max(.5,(target-today)/DAY/7), neededPerWeek = remaining/weeksLeft;
  let projected=null, pace;
  if (ready) pace={cls:"p-gold",txt:"Ready to apply"};
  else if (q>=R.tte) pace={cls:"p-ok",txt:"TTE goal met"};
  else if (q===0) pace={cls:"p-new",txt:"Not started"};
  else { projected = new Date(today.getTime()+remaining/(q/elapsed)*DAY);
    pace = projected<=target ? {cls:"p-ok",txt:"On track"} : projected<=new Date(target.getTime()+60*DAY) ? {cls:"p-warn",txt:"Pick up pace"} : {cls:"p-bad",txt:"Behind"}; }
  return {...r, f, steps, doneCount, ready, overall, perWeek, neededPerWeek, remaining, projected, pace, start, target, today,
    revFrac: q ? Math.min(r.reviewed/q,1) : 0, concRate: r.reviewed ? r.concordant/r.reviewed : null};
}

/* ---------- SVG ---------- */
function polar(cx,cy,r,a){ const t=(a-90)*Math.PI/180; return [cx+r*Math.cos(t), cy+r*Math.sin(t)]; }
function arc(cx,cy,r,a0,a1){ if (a1-a0<.3) return ""; if (a1-a0>=359.9) a1=a0+359.9;
  const [x0,y0]=polar(cx,cy,r,a0),[x1,y1]=polar(cx,cy,r,a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }
function ring(st,size){
  let p = `<circle cx="50" cy="50" r="40" stroke="var(--track)" stroke-width="9" fill="none"/>`;
  p += `<path d="${arc(50,50,40,0,360*st.f)}" stroke="var(--cardiac)" stroke-width="9" fill="none" stroke-linecap="round"><title>Qualifying ${st.qualifying}/${R.tte}</title></path>`;
  p += `<circle cx="50" cy="50" r="29" stroke="var(--track)" stroke-width="5" fill="none"/>`;
  p += `<path d="${arc(50,50,29,0,360*st.revFrac*st.f)}" stroke="var(--lung)" stroke-width="5" fill="none" stroke-linecap="round"><title>Reviewed ${st.reviewed}</title></path>`;
  const halo = st.ready ? `<circle cx="50" cy="50" r="48" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="2 3"/>` : "";
  const c = st.ready ? `<text x="50" y="47" text-anchor="middle" font-size="15" fill="var(--gold)">&#9733;</text><text x="50" y="60" text-anchor="middle" font-size="8" font-weight="700" fill="var(--ink)">READY</text>`
    : `<text x="50" y="52" text-anchor="middle" font-size="16" font-weight="800" fill="var(--ink)">${st.qualifying}</text><text x="50" y="62" text-anchor="middle" font-size="7" fill="var(--muted)">of ${R.tte} TTEs</text>`;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${st.qualifying} of ${R.tte} qualifying TTEs">${halo}${p}${c}</svg>`;
}
function paceChart(st){
  const W=320,H=150,L=30,Rr=10,T=12,B=24, end=new Date(Math.max(st.target, st.projected||0, st.today)+15*DAY);
  const x=d=>L+(d-st.start)/(end-st.start)*(W-L-Rr), ymax=Math.max(R.tte,st.qualifying)*1.08, y=v=>H-B-v/ymax*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="TTE pace chart">`;
  [0,50,100,150].forEach(v=>{ s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="var(--muted)">${v}</text>`; });
  s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(R.tte)}" y2="${y(R.tte)}" stroke="var(--accent)" stroke-dasharray="4 3"/>`;
  s+=`<line x1="${x(st.target)}" x2="${x(st.target)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${x(st.target)}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--muted)">Graduation</text>`;
  s+=`<text x="${L}" y="${H-8}" font-size="9" fill="var(--muted)">Start</text>`;
  s+=`<line x1="${x(st.start)}" y1="${y(0)}" x2="${x(st.target)}" y2="${y(R.tte)}" stroke="var(--track)" stroke-width="2"/>`;
  if (st.projected && st.qualifying<R.tte) s+=`<line x1="${x(st.today)}" y1="${y(st.qualifying)}" x2="${x(st.projected)}" y2="${y(R.tte)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4" opacity=".6"/>`;
  s+=`<path d="M${x(st.start)} ${y(0)} L${x(st.today)} ${y(st.qualifying)} L${x(st.today)} ${y(0)}Z" fill="var(--accent)" opacity=".1"/>`;
  s+=`<line x1="${x(st.start)}" y1="${y(0)}" x2="${x(st.today)}" y2="${y(st.qualifying)}" stroke="var(--accent)" stroke-width="2.5"/>`;
  s+=`<circle cx="${x(st.today)}" cy="${y(st.qualifying)}" r="4.5" fill="var(--accent)"/><text x="${x(st.today)}" y="${y(st.qualifying)-9}" font-size="10" font-weight="700" text-anchor="middle" fill="var(--ink)">${st.qualifying}</text>`;
  return s+`</svg>`;
}
function nextSteps(st){
  if (st.ready) return ["Every NBE requirement is documented. Submit your certification application at echoboards.org."];
  const out=[];
  if (st.qualifying<R.tte){
    out.push(`Log ${st.remaining} more qualifying TTE${st.remaining===1?"":"s"}: complete exams you personally perform and interpret.`);
    if (st.qualifying>0) out.push(`Aim for about <b>${Math.ceil(st.neededPerWeek)} per week</b> to reach ${R.tte} by ${fmt(st.target)}.`);
  }
  if (st.logged>st.qualifying) out.push(`${st.logged-st.qualifying} logged exam${st.logged-st.qualifying===1?" does":"s do"} not qualify yet. Check Complete TTE and Fellow Role.`);
  if (st.qualifying>0 && st.reviewed<Math.min(st.qualifying,10)) out.push("Ask your supervisor to review recent studies and complete the review columns.");
  if (st.exam==="") out.push(`Register for the CCEeXAM (next exam ${fmt(pd(CONFIG.nextExam))}).`);
  if (st.qualifying>=R.tte && !st.logSigned) out.push("Have your fellowship director sign your case log.");
  if (st.qualifying>=R.tte && !st.letter) out.push("Request the notarized letter stating your exact number of studies.");
  return out.slice(0,4);
}

/* ---------- render ---------- */
function shell(){
  $("#app").innerHTML = `
    <header class="hero">
      <div class="eyebrow">Pulmonary POCUS &middot; Fellow's Corner &middot; ${esc(CONFIG.program)}</div>
      <h1>${esc(CONFIG.title)}</h1>
      <div class="sub">Tracks NBE certification in Critical Care Echocardiography, Supervised Training Pathway &middot; Updated ${fmt(pd(CONFIG.lastUpdated))}</div>
      <div class="chips" id="srcchip"></div>
      <div class="stats" id="stats"></div>
    </header>
    ${howItWorks()}
    ${uploadPanel()}
    <div class="toolbar">
      <h2>Fellow progress</h2>
      <input type="search" id="q" placeholder="Find a fellow" aria-label="Search fellows">
      <div class="seg" id="yr"><button data-v="all" class="on">All</button><button data-v="1">F1</button><button data-v="2">F2</button><button data-v="3">F3</button></div>
      <select id="sort" aria-label="Sort by"><option value="progress">Sort: progress</option><option value="tte">Sort: TTEs</option><option value="pace">Sort: pace</option><option value="name">Sort: name</option></select>
      <div class="seg" id="view"><button data-v="cards" class="on">Cards</button><button data-v="table">Table</button></div>
    </div>
    <div id="list"></div>
    <div class="toolbar"><h2>The NBE pathway</h2></div>
    <div class="reqs">${reqCards()}</div>
    <div class="foot">Requirements summarized from the <a href="https://www.echoboards.org/certification/critical_care_certification/" target="_blank" rel="noopener">NBE Critical Care Echocardiography certification page</a>. Always confirm current rules with NBE before applying. Questions: <a href="mailto:${CONFIG.contact}">${CONFIG.contact}</a></div>`;
  $("#q").addEventListener("input",e=>{query=e.target.value.toLowerCase();openIdx=null;renderList();});
  $("#sort").addEventListener("change",e=>{sortBy=e.target.value;openIdx=null;renderList();});
  segment("#yr",v=>{yrFilter=v;openIdx=null;renderList();});
  segment("#view",v=>{view=v;renderList();});
  wireUpload();
}
function segment(sel,cb){ $(sel).addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  $(sel).querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); cb(b.dataset.v); }); }
function howItWorks(){
  const steps=[
    ["Download your log",`Get the <a href="${CONFIG.logUrl}" target="_blank" rel="noopener">critical care echo case log</a> once and keep it on your own computer for all of fellowship.`],
    ["Log every TTE","Columns follow the NBE case log. Only complete exams you personally perform and interpret qualify. Your supervisor fills in the review columns."],
    ["Upload it here","Open <b style=\"display:inline\">Fellows: upload your echo log</b> below, choose your file, check the counts, and submit. Only your name, year and counts are sent."],
    ["Watch your card","Your card updates within about 5 minutes and shows Pending review until faculty verify it. Upload again whenever you add studies."],
    ["Apply to NBE","Pass the CCEeXAM, get your log signed and a notarized letter from your fellowship director, then apply once board certified."]
  ];
  return `<section class="how"><h2>How it works</h2>
    <ol>${steps.map(([t,b],i)=>`<li><span class="ico">${i+1}</span><div><b>${t}</b>${b}</div></li>`).join("")}</ol>
    <div class="phi" role="note"><strong>NO PATIENT PHI</strong>Never enter patient names, MRNs, dates of birth, room numbers or any other patient identifier in your echo log, including the findings, diagnosis and comments columns. NBE returns logs that contain patient information.</div>
  </section>`;
}
function reqCards(){
  const items=[
    ["1","CCEeXAM","<p>Pass the Examination of Special Competence in Critical Care Echocardiography to earn Testamur status.</p>"],
    ["2","License","<p>A valid, unrestricted medical license at the time you apply.</p>"],
    ["3","Board certification","<p>Certification by an ABMS, AOA, AAPS or Royal College board, or an international equivalent.</p>"],
    ["4","Critical care training","<p>At least one year of ACGME accredited fellowship training dedicated to adult critical care. Cardiology rotations during residency do not count.</p>"],
    ["5","150 critical care TTEs",`<ul><li>Complete, medically necessary transthoracic exams, personally performed and interpreted under a qualified supervisor.</li><li>Limited or goal-directed exams do not count; neither do education or research only scans.</li><li>One repeat exam per patient, only for a change in status or to assess an intervention.</li><li>Supervisor holds NBE echo certification, or Testamur status within 10 years with critical care echo expertise, and reviews a subset of cases.</li></ul>`],
    ["6","Documents","<p>A chronological case log in NBE format with date, indication, findings, diagnosis, attending, review date and supervising faculty, signed by you and your fellowship director, plus an original notarized letter from the director stating your exact numbers.</p>"]
  ];
  return items.map(([n,t,b])=>`<details><summary><span class="ico">${n}</span>${t}</summary>${b}</details>`).join("");
}
function renderTop(){
  const all=data.map(compute);
  const q=all.reduce((s,r)=>s+r.qualifying,0), onPace=all.filter(r=>["On track","TTE goal met","Ready to apply"].includes(r.pace.txt)).length;
  const testamurs=all.filter(r=>r.exam==="Passed").length;
  $("#stats").innerHTML=[[all.length,"Fellows enrolled"],[q.toLocaleString(),"Qualifying TTEs"],[`${onPace}/${all.length}`,"On pace"],[testamurs,"CCEeXAM testamurs"]]
    .map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
}
function filtered(){
  let list=data.map((r,i)=>({...compute(r),i}));
  if (yrFilter!=="all") list=list.filter(r=>String(r.year)===yrFilter);
  if (query) list=list.filter(r=>r.name.toLowerCase().includes(query));
  const pr=r=>r.ready?0:r.qualifying>=R.tte?1:r.projected?r.projected.getTime():9e15;
  const S={progress:(a,b)=>b.overall-a.overall, tte:(a,b)=>b.qualifying-a.qualifying, pace:(a,b)=>pr(a)-pr(b), name:(a,b)=>a.name.localeCompare(b.name)};
  return list.sort(S[sortBy]);
}
function renderList(){
  const list=filtered(), box=$("#list");
  if (!list.length){ box.innerHTML=`<div class="empty">${data.length?"No fellows match.":"No fellows yet. Upload your echo log above to appear here."}</div>`; post(); return; }
  if (view==="cards"){
    box.innerHTML=`<div class="grid">${list.map(st=>`
      <button class="card ${st.ready?"cred":""}" data-i="${st.i}" aria-expanded="false">
        ${ring(st,104)}
        <div><div class="name">${esc(st.name)}</div><div class="meta">${st.year?`F${st.year} &middot; `:""}${st.reviewed} reviewed &middot; ${st.doneCount}/5 milestones</div></div>
        <div class="dots">${st.steps.map(s=>`<span class="dot ${s.done?"done":s.part?"part":""}" title="${esc(s.t)}"></span>`).join("")}</div>
        <span class="pill ${st.pace.cls}">${st.pace.txt}</span>
        ${st.pending?`<span class="pill p-new" title="Self-reported upload, not yet verified">Pending review</span>`:""}
      </button>`).join("")}</div>`;
    box.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>toggleCard(+c.dataset.i,c)));
    if (openIdx!==null){ const c=box.querySelector(`.card[data-i="${openIdx}"]`); openIdx=null; if(c) toggleCard(+c.dataset.i,c,true); }
  } else {
    const yes=v=>v?"&#10003;":"&middot;";
    box.innerHTML=`<div class="tblwrap"><table><thead><tr><th>Fellow</th><th>Qualifying<br><span style="font-weight:400">/${R.tte}</span></th><th>Logged</th><th>Reviewed</th><th>Concordant</th><th>CCEeXAM</th><th>Log signed</th><th>Letter</th><th>Boards</th><th>Overall</th></tr></thead><tbody>
      ${list.map(st=>`<tr class="r" data-i="${st.i}"><td><b>${esc(st.name)}</b>${st.year?` <span class="meta">F${st.year}</span>`:""}${st.pending?` <span class="meta">(pending)</span>`:""}</td>
        <td style="background:color-mix(in srgb, var(--cardiac) ${Math.round(st.f*55)}%, transparent)" class="${st.f>=1?"h":""}">${st.qualifying}</td>
        <td>${st.logged}</td><td>${st.reviewed}</td><td>${st.concRate===null?"&middot;":pct(st.concRate)+"%"}</td>
        <td>${st.exam||"&middot;"}</td><td>${yes(st.logSigned)}</td><td>${yes(st.letter)}</td><td>${yes(st.boards)}</td>
        <td><span class="pill ${st.ready?"p-gold":"p-new"}">${st.ready?"&#9733; Ready":pct(st.overall)+"%"}</span></td></tr>`).join("")}
      </tbody></table></div>`;
    box.querySelectorAll("tr.r").forEach(tr=>tr.addEventListener("click",()=>toggleRow(+tr.dataset.i,tr)));
  }
  post();
}
function detail(st){
  const el=document.createElement("div"); el.className="detail";
  const proj = st.qualifying>=R.tte ? "TTE requirement complete." : st.qualifying===0 ? "No qualifying TTEs yet. Download the case log to get started."
    : `Averaging <b>${st.perWeek.toFixed(1)} qualifying TTEs/week</b>. At this pace you reach ${R.tte} by <b>${fmt(st.projected)}</b>.`;
  const bar=(lab,n,d,color,sub)=>`<div class="cat"><div class="row"><b>${lab}</b><span>${n}${d?` / ${d}`:""}</span></div><div class="bar"><i style="width:${d?Math.min(n/d,1)*100:0}%;background:${color}"></i></div><div class="togo">${sub}</div></div>`;
  el.innerHTML=`
    <div class="dhead"><h3>${esc(st.name)}</h3>${st.year?`<span class="pill p-new">F${st.year}</span>`:""}<span class="pill ${st.pace.cls}">${st.pace.txt}</span>
      ${st.pending?`<span class="pill p-new">Pending review</span>`:""}<button class="x" aria-label="Close">&times;</button></div>
    ${st.uploaded?`<div class="meta" style="margin-top:6px">Self-reported from echo log uploaded ${esc(st.uploaded)}${st.pending?", pending faculty review":", verified"}.</div>`:""}
    <div class="dgrid">
      <div class="sec ringbox"><h4>TTE wheel</h4>${ring(st,200)}
        <div class="legend"><span style="--c:var(--cardiac)">Qualifying ${st.qualifying}</span><span style="--c:var(--lung)">Reviewed ${st.reviewed}</span></div></div>
      <div class="sec"><h4>Requirement 5: critical care TTEs</h4>
        ${bar("Qualifying TTEs",st.qualifying,R.tte,"var(--cardiac)",st.qualifying>=R.tte?"Requirement met":`${st.remaining} to go`)}
        ${bar("All TTEs logged",st.logged,R.tte,"var(--vascular)",st.logged>st.qualifying?`${st.logged-st.qualifying} not yet qualifying`:"All logged exams qualify")}
        ${bar("Reviewed with supervisor",st.reviewed,st.qualifying||R.tte,"var(--lung)",st.concRate===null?"No reviews yet":`${st.concordant} concordant (${pct(st.concRate)}%)`)}
        <h4 style="margin-top:14px">Pace to graduation (${fmt(st.target)})</h4>
        <div class="pace">${paceChart(st)}<p>${proj}</p></div>
      </div>
      <div class="sec"><h4>NBE milestones</h4>
        ${st.steps.map((s,i)=>`<div class="step ${s.done?"done":s.part?"part":""}"><span class="ico">${s.done?"&#10003;":i+1}</span><div><div class="t">${s.t}</div><div class="s">${s.s}</div></div></div>`).join("")}
        <h4 style="margin-top:12px">Next best steps</h4>
        <ul class="next">${nextSteps(st).map(n=>`<li>${n}</li>`).join("")}</ul>
        ${st.note?`<div class="note">&#128221; ${esc(st.note)}</div>`:""}
      </div>
    </div>`;
  return el;
}
function closeOpen(){
  document.querySelectorAll(".detail").forEach(d=>{ const tr=d.closest("tr"); tr?tr.remove():d.remove(); });
  document.querySelectorAll(".card.open").forEach(c=>{ c.classList.remove("open"); c.setAttribute("aria-expanded","false"); });
}
function toggleCard(i,card,force){
  const was=openIdx===i&&!force; closeOpen(); openIdx=null; if(was){post();return;}
  openIdx=i; card.classList.add("open"); card.setAttribute("aria-expanded","true");
  let last=card; [...card.parentElement.querySelectorAll(".card")].forEach(c=>{ if(c.offsetTop===card.offsetTop) last=c; });
  const d=detail(compute(data[i])); last.after(d);
  d.querySelector(".x").addEventListener("click",e=>{ e.stopPropagation(); closeOpen(); openIdx=null; post(); card.focus(); });
  post(); if(!force) setTimeout(()=>d.scrollIntoView({behavior:"smooth",block:"nearest"}),60);
}
function toggleRow(i,tr){
  const was=openIdx===i; closeOpen(); openIdx=null; if(was){post();return;}
  openIdx=i; const row=document.createElement("tr"), td=document.createElement("td");
  td.colSpan=tr.children.length; td.className="dt"; const d=detail(compute(data[i])); td.appendChild(d); row.appendChild(td); tr.after(row);
  d.querySelector(".x").addEventListener("click",()=>{ closeOpen(); openIdx=null; post(); }); post();
}

/* ---------- fellow upload ---------- */
function uploadPanel(){
  return `<details class="up" id="up"><summary><span class="ico">&#8679;</span>Fellows: upload your echo log</summary>
    <div class="steps">
      <div class="st"><b>1. Keep your own log</b>Download the <a href="${CONFIG.logUrl}" target="_blank" rel="noopener">critical care echo case log</a> once and log every TTE in it.</div>
      <div class="st"><b>2. Choose your file</b><input type="file" id="upf" accept=".xlsx"><div class="meta" style="margin-top:6px">Read in your browser. Only your name, fellowship year and the counts below are sent, never findings or diagnoses.</div></div>
      <div class="st"><b>3. Check and submit</b><div id="upprev" class="meta">Your counts will appear here.</div></div>
    </div><div id="upmsg"></div></details>`;
}
function loadXLSX(){ if(window.XLSX) return Promise.resolve();
  return new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=ok; s.onerror=bad; document.head.appendChild(s); }); }
function upMsg(cls,html){ $("#upmsg").innerHTML = html?`<div class="msg ${cls}">${html}</div>`:""; post(); }
function parseLog(wb){
  const cell=(ws,a)=>{ const c=ws&&ws[a]; return c?c.v:null; };
  const isDate=v=>v instanceof Date||typeof v==="number"||(typeof v==="string"&&v.trim()&&!isNaN(Date.parse(v)));
  const sum=wb.Sheets["Summary"], ws=wb.Sheets["TTE Log"];
  if (!sum||!ws) throw new Error("tabs");
  const col={};
  for (let c=0;c<40;c++){ const a=XLSX.utils.encode_col(c), h=String(cell(ws,a+"6")||"").toLowerCase().replace(/\s+/g," ").trim();
    if (h.startsWith("date performed")) col.d=a; else if (h.startsWith("complete tte")) col.cmp=a; else if (h.startsWith("fellow role")) col.role=a;
    else if (h.startsWith("date reviewed")) col.rev=a; else if (h.startsWith("reviewer assessment")) col.agr=a; }
  if (!col.d||!col.cmp||!col.role) throw new Error("cols");
  const out={name:String(cell(sum,"C5")||"").trim(), year:String(cell(sum,"C6")||"").trim().toUpperCase(), logged:0, qualifying:0, reviewed:0, concordant:0};
  for (let r=8;r<=1000;r++){
    if (!isDate(cell(ws,col.d+r))) continue;
    out.logged++;
    const ok = String(cell(ws,col.cmp+r)||"").trim().toLowerCase()==="yes" && String(cell(ws,col.role+r)||"").trim().toLowerCase()==="performed & interpreted";
    if (ok) out.qualifying++;
    if (col.rev && isDate(cell(ws,col.rev+r))) out.reviewed++;
    if (col.agr && String(cell(ws,col.agr+r)||"").trim().toLowerCase()==="agree") out.concordant++;
  }
  return out;
}
function showPreview(){
  const p=parsed;
  $("#upprev").innerHTML=`
    <label>Name <input type="text" id="upname" value="${esc(p.name)}" placeholder="First Last" style="width:100%;margin-top:3px"></label>
    <label style="display:block;margin-top:6px">Year <select id="upyr"><option value="">Select</option>${["F1","F2","F3"].map(n=>`<option ${p.year===n?"selected":""}>${n}</option>`).join("")}</select></label>
    <table><tr><th>Logged</th><th>Qualifying</th><th>Reviewed</th><th>Concordant</th></tr>
      <tr><td>${p.logged}</td><td>${p.qualifying}</td><td>${p.reviewed}</td><td>${p.concordant}</td></tr></table>
    <button class="btn" id="upsend" style="margin-top:8px">Submit to dashboard</button>`;
  $("#upsend").addEventListener("click",sendUpload); post();
}
async function sendUpload(){
  const name=$("#upname").value.trim().replace(/\s+/g," "), yr=$("#upyr").value;
  if (name.split(" ").length<2){ upMsg("err","Enter your first and last name the same way each time, so updates land on your card."); return; }
  if (!yr){ upMsg("err","Select your fellowship year."); return; }
  const p=parsed, payload=[yr,p.logged,p.qualifying,p.reviewed,p.concordant].join(",");
  const b=$("#upsend"); b.disabled=true; b.textContent="Sending...";
  try{
    await fetch(CONFIG.uploadFormUrl,{method:"POST",mode:"no-cors",body:new URLSearchParams({[CONFIG.uploadNameField]:name,[CONFIG.uploadDataField]:payload})});
    b.textContent="Submitted";
    upMsg("ok",`Thanks, ${esc(name.split(" ")[0])}. Your card updates within about 5 minutes and shows <b>Pending review</b> until faculty verify it. Re-upload any time your log changes.`);
  }catch(e){ b.disabled=false; b.textContent="Submit to dashboard"; upMsg("err",`Upload failed. Check your connection and try again, or email <a href="mailto:${CONFIG.contact}">${CONFIG.contact}</a>.`); }
}
function wireUpload(){
  $("#up").addEventListener("toggle",post);
  $("#upf").addEventListener("change",async e=>{
    const f=e.target.files[0]; if(!f) return; upMsg("","");
    try{ await loadXLSX(); const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true}); parsed=parseLog(wb); showPreview(); }
    catch(err){ parsed=null; $("#upprev").textContent="Your counts will appear here."; upMsg("err","That file does not look like the Critical Care Echo Case Log. Download a fresh copy from step 1 and copy your entries into it."); }
  });
}

/* ---------- data ---------- */
async function load(){
  let source="No data yet";
  try{ const res=await fetch(CONFIG.sheetCsvUrl+(CONFIG.sheetCsvUrl.includes("?")?"&":"?")+"t="+Date.now()); if(!res.ok) throw 0;
    data=parseCSV(await res.text()).map(normalize).filter(r=>r.name); source="Live from Google Sheet"; }
  catch(e){ data=[]; source="Sheet unavailable"; }
  $("#srcchip").innerHTML=`<span class="chip">${source}</span><span class="chip">Next CCEeXAM ${fmt(pd(CONFIG.nextExam))}</span><span class="chip">Target ${R.tte} qualifying TTEs</span>`;
  renderTop(); renderList();
}
function post(){ const h=Math.ceil(document.getElementById("app").getBoundingClientRect().height)+8;
  try{ parent.postMessage({labHeight:h, lab:"echoboards", credentialingHeight:h}, "*"); }catch(e){} }
if (window.ResizeObserver) new ResizeObserver(post).observe(document.body);
window.addEventListener("load",post);
const theme=CONFIG.theme==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):CONFIG.theme;
document.documentElement.setAttribute("data-theme",theme);
shell(); load();
</script>
